name: Windows install test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  install-and-test:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Run installer (Windows PowerShell 5.1, same as end users)
        shell: powershell
        env:
          STUDIO3D_SRC: ${{ github.workspace }}
          STUDIO3D_NONINTERACTIVE: '1'
        run: .\install.ps1

      - name: Unit tests with the installed Python
        shell: powershell
        run: |
          $Root = Join-Path $env:LOCALAPPDATA 'Studio3D'
          $Py = Join-Path $Root 'python\tools\python.exe'
          & $Py -m pip install --disable-pip-version-check pytest
          Set-Location (Join-Path $Root 'app')
          $env:PYTHONPATH = (Get-Location).Path
          & $Py -m pytest -q tests
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Smoke test - app starts and serves the UI
        shell: powershell
        run: |
          $Root = Join-Path $env:LOCALAPPDATA 'Studio3D'
          $Py = Join-Path $Root 'python\tools\python.exe'
          $App = Join-Path $Root 'app'
          $env:PYTHONPATH = $App
          $p = Start-Process -FilePath $Py -ArgumentList '-m','studio3d','--no-window' -WorkingDirectory $App -PassThru -RedirectStandardOutput out.log -RedirectStandardError err.log
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 3
            try {
              $r = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:7860/' -TimeoutSec 5
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-Content out.log -Tail 20
          Get-Content err.log -Tail 20
          if (-not $ok) { throw 'UI did not start' }
